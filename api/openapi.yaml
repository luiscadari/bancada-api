              $ref: "#/components/schemas/OrderStatus"
            reported_defect:
              type: string
            diagnosis:
              type: string
              nullable: true
            technical_report:
              type: string
              nullable: true
            entry_checklist:
              $ref: "#/components/schemas/EntryChecklist"
            accessories:
              type: string
              nullable: true
            has_device_password:
              type: boolean
            pre_authorized_cents:
              type: integer
              format: int64
              nullable: true
            diagnostic_fee_cents:
              type: integer
              format: int64
              description: Diagnostic fee due on the order (RN-13, RN-14).
            approved_total_cents:
              type: integer
              format: int64
              description: Total of the approved quote, zero when none.
            amount_due_cents:
              type: integer
              format: int64
              description: Approved total plus the diagnostic fee due.
            open_balance_cents:
              type: integer
              format: int64
              description: Balance left open at delivery with the owner's authorization (RN-15).
            balance_authorized_by:
              type: string
              format: uuid
              nullable: true
            expected_delivery_at:
              type: string
              format: date-time
              nullable: true
            ready_at:
              type: string
              format: date-time
              nullable: true
              description: When the equipment became available for pickup (ready or awaiting_pickup).
            delivered_at:
              type: string
              format: date-time
              nullable: true
            canceled_at:
              type: string
              format: date-time
              nullable: true
            abandoned_at:
              type: string
              format: date-time
              nullable: true
            cancel_reason:
              type: string
              nullable: true
            picked_up_by_name:
              type: string
              nullable: true
            picked_up_by_document:
              type: string
              nullable: true

    WarrantyItem:
      type: object
      required: [item_id, order_id, order_number, kind, description, warranty_until]
      properties:
        item_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        order_number:
          type: string
        kind:
          $ref: "#/components/schemas/QuoteItemKind"
        description:
          type: string
        warranty_until:
          type: string
          format: date
        delivered_at:
          type: string
          format: date-time
          nullable: true

    ServiceOrderOpened:
      type: object
      required: [order, active_warranties]
      properties:
        order:
          $ref: "#/components/schemas/ServiceOrder"
        active_warranties:
          type: array
          description: Items of earlier orders still under warranty for this equipment (UC-01 2b).
          items:
            $ref: "#/components/schemas/WarrantyItem"

    ServiceOrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrder"
        next_cursor:
          type: string
          nullable: true

    EquipmentHistory:
      type: object
      required: [items, active_warranties]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrder"
        next_cursor:
          type: string
          nullable: true
        active_warranties:
          type: array
          items:
            $ref: "#/components/schemas/WarrantyItem"

    ServiceOrderUpdate:
      type: object
      minProperties: 1
      description: Send an empty string to clear diagnosis, technical_report, accessories or device_password.
      properties:
        diagnosis:
          type: string
          maxLength: 8000
        technical_report:
          type: string
          maxLength: 8000
        accessories:
          type: string
          maxLength: 2000
        device_password:
          type: string
          maxLength: 200
        expected_delivery_at:
          type: string
          format: date-time
        pre_authorized_cents:
          type: integer
          format: int64
          minimum: 0
        requester_contact_id:
          type: string
          format: uuid
        cost_center_id:
          type: string
          format: uuid

    Assignment:
      type: object
      minProperties: 1
      properties:
        technician_id:
          type: string
          format: uuid
        unassign:
          type: boolean
          description: Remove the technician.
        priority:
          $ref: "#/components/schemas/Priority"

    Transition:
      type: object
      required: [to]
      properties:
        to:
          type: string
          enum: [diagnosing, awaiting_pickup, in_progress, awaiting_part, testing, ready]
        reason:
          type: string
          maxLength: 2000
          description: Required when the diagnosis ends without repair (diagnosing → awaiting_pickup).

    StatusChange:
      type: object
      required: [id, to_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        from_status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          nullable: true
        to_status:
          $ref: "#/components/schemas/OrderStatus"
        reason:
          type: string
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    StatusChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatusChange"

    DevicePassword:
      type: object
      required: [password]
      properties:
        password:
          type: string

    QuoteStatus:
      type: string
      enum: [draft, sent, approved, rejected, superseded]

    QuoteItemKind:
      type: string
      enum: [service, part]

    DecisionChannel:
      type: string
      enum: [counter, phone, whatsapp, email, portal, pre_authorized, no_charge]

    QuoteItem:
      type: object
      required: [id, position, kind, description, quantity, list_price_cents, unit_price_cents,
                 discount_cents, total_cents, optional, warranty_days]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        kind:
          $ref: "#/components/schemas/QuoteItemKind"
        service_id:
          type: string
          format: uuid
          nullable: true
        product_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        quantity:
          $ref: "#/components/schemas/Quantity"
        list_price_cents:
          type: integer
          format: int64
          description: Catalog price when the item was quoted.
        unit_price_cents:
          type: integer
          format: int64
        discount_cents:
          type: integer
          format: int64
        total_cents:
          type: integer
          format: int64
        optional:
          type: boolean
          description: The customer may decline this item (UC-03 3b).
        warranty_days:
          type: integer
        warranty_until:
          type: string
          format: date
          nullable: true
          description: Set at delivery (RN-18).
        covered_item_id:
          type: string
          format: uuid
          nullable: true
          description: Item of the original order covered by warranty, charged at zero (RN-19).

    QuoteItemInput:
      type: object
      required: [kind]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        kind:
          $ref: "#/components/schemas/QuoteItemKind"
        service_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
          description: Defaults to the catalog name.
        quantity:
          type: number
          format: double
          minimum: 0.001
          maximum: 1000000
          default: 1
        unit_price_cents:
          type: integer
          format: int64
          minimum: 0
          description: Defaults to the catalog price. A lower price counts as discount (RN-12).
        discount_cents:
          type: integer
          format: int64
          minimum: 0
        optional:
          type: boolean
        warranty_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: Defaults to the catalog warranty.
        covered_item_id:
          type: string
          format: uuid
          description: Warranty item of the original order (warranty returns only).

    Quote:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, order_id, number, status, subtotal_cents, discount_cents, total_cents, items]
          properties:
            id:
              type: string
              format: uuid
            order_id:
              type: string
              format: uuid
            number:
              type: integer
              description: Version of the quote within the order (1, 2, ...).
            status:
              $ref: "#/components/schemas/QuoteStatus"
            notes:
              type: string
              nullable: true
            subtotal_cents:
              type: integer
              format: int64
            discount_cents:
              type: integer
              format: int64
            total_cents:
              type: integer
              format: int64
            sent_at:
              type: string
              format: date-time
              nullable: true
            valid_until:
              type: string
              format: date-time
              nullable: true
            decision_channel:
              allOf:
                - $ref: "#/components/schemas/DecisionChannel"
              nullable: true
            decided_by_name:
              type: string
              nullable: true
            decided_by_contact_id:
              type: string
              format: uuid
              nullable: true
            decided_by_user_id:
              type: string
              format: uuid
              nullable: true
            decided_at:
              type: string
              format: date-time
              nullable: true
            rejection_reason:
              type: string
              nullable: true
            previous_quote_id:
              type: string
              format: uuid
              nullable: true
            items:
              type: array
              items:
                $ref: "#/components/schemas/QuoteItem"

    QuoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Quote"

    QuoteInput:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        notes:
          type: string
          maxLength: 4000
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuoteItemInput"

    QuoteUpdate:
      type: object
      required: [items]
      properties:
        notes:
          type: string
          maxLength: 4000
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/QuoteItemInput"

    QuoteDecision:
      type: object
      required: [decision, channel]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        channel:
          type: string
          enum: [counter, phone, whatsapp, email]
          description: How the customer answered (the portal has its own flow).
        approver_name:
          type: string
          maxLength: 200
          description: Who authorized. Required unless approver_contact_id is sent.
        approver_contact_id:
          type: string
          format: uuid
          description: Required for companies; must be an approver within its limit (RN-34).
        rejection_reason:
          type: string
          maxLength: 2000
        accepted_item_ids:
          type: array
          description: Items the customer accepted. Omit to accept everything.
          items:
            type: string
            format: uuid

    OrderQuote:
      type: object
      required: [order, quote]
      properties:
        order:
          $ref: "#/components/schemas/ServiceOrder"
        quote:
          $ref: "#/components/schemas/Quote"

    Delivery:
      type: object
      properties:
        picked_up_by_name:
          type: string
          maxLength: 200
          description: Third party who picked the equipment up (UC-05 1a).
        picked_up_by_document:
          type: string
          maxLength: 40
        authorize_open_balance:
          type: boolean
          description: Owner's authorization to deliver with an open balance (RN-15).

    Cancelation:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000

    Abandonment:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000

    WarrantyReturn:
      type: object
      required: [reported_defect, entry_checklist]
      properties:
        id:
          $ref: "#/components/schemas/ClientId"
        reserved_sequence:
          type: integer
          format: int64
          minimum: 1
        reported_defect:
          type: string
          minLength: 1
          maxLength: 4000
        entry_checklist:
          $ref: "#/components/schemas/EntryChecklist"
        accessories:
          type: string
          maxLength: 2000
        device_password:
          type: string
          maxLength: 200
        expected_delivery_at:
          type: string
          format: date-time
        technician_id:
          type: string
          format: uuid
        covered_item_ids:
          type: array
          description: Warranty items to cover. Omit to cover every active one.
          items:
            type: string
            format: uuid
